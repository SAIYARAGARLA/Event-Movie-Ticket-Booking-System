<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Seat Map Test</title><style>body{font-family:Arial;margin:2rem}.grid{display:grid;grid-template-columns:repeat(12,minmax(35px,1fr));gap:7px}.seat{padding:10px 4px;border-radius:5px;text-align:center;background:#ddd}.Available{background:#b8e6c1}.Locked{background:#ffd580}.Yours{background:#80c7ff}.Booked,.Unavailable{background:#aaa}.row{margin:12px 0}.legend span{margin-right:12px}</style></head><body><h1>Live seat map test</h1><p>Enter show ID and access token, then connect. Open this page in two tabs to test broadcasts.</p><label>Show ID <input id="show" value="1"></label> <label>Access token <input id="token" size="55"></label> <button id="connect">Connect</button><p id="status">Disconnected</p><div class="legend"><span>🟩 Available</span><span>🟨 Locked</span><span>🟦 Yours</span><span>⬜ Booked/unavailable</span></div><div id="map"></div><script>let ws;document.getElementById('connect').onclick=()=>{if(ws)ws.close();const id=document.getElementById('show').value,token=document.getElementById('token').value;ws=new WebSocket(`ws://${location.host}/ws/shows/${id}/seats?token=${encodeURIComponent(token)}`);ws.onopen=()=>document.getElementById('status').textContent='Connected';ws.onclose=()=>document.getElementById('status').textContent='Disconnected';ws.onerror=()=>document.getElementById('status').textContent='Connection error';ws.onmessage=e=>{const data=JSON.parse(e.data);if(data.type==='seat_map')draw(data.seats);else if(data.seats)draw(data.seats);};};function draw(seats){const rows={};seats.forEach(s=>(rows[s.row]=rows[s.row]||[]).push(s));const root=document.getElementById('map');root.innerHTML='';Object.keys(rows).sort().forEach(r=>{const line=document.createElement('div');line.className='row';line.innerHTML='<b>'+r+'</b> ';const grid=document.createElement('div');grid.className='grid';rows[r].forEach(s=>{const el=document.createElement('div');el.className='seat '+s.status;el.textContent=r+s.seat_number;el.title=s.status;grid.appendChild(el);});line.appendChild(grid);root.appendChild(line);});}</script></body></html>
